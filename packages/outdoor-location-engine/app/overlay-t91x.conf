# Thingy:91 X overrides, free uart1 for RAK3172 LoRa module.
# uart1 is normally reserved for modem traces and TFM logging; both are
# disabled here so the NS app can own it.
CONFIG_NRF_MODEM_LIB_TRACE=n
CONFIG_TFM_LOG_LEVEL_SILENCE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# WiFi location via nRF7002 companion IC (scan-only, WIFI_NRF70 set via Kconfig.sysbuild)
CONFIG_WIFI=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=n
CONFIG_NRF_WIFI_IF_AUTO_START=n
CONFIG_LOCATION_METHOD_WIFI=y
CONFIG_NET_NATIVE=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DEFAULT_IF_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_MBEDTLS=n
CONFIG_NORDIC_SECURITY_BACKEND=n
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=10240
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_WIFI_LOG_LEVEL_DBG=y
