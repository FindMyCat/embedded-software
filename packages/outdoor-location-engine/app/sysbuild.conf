# MCUboot so the app can be updated over the network. Swap-using-move keeps the
# old image to roll back to; both slots live in internal flash.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y

# Without a key of our own MCUboot signs with its public development key, so
# anyone could sign an image the collar accepts. Before shipping:
#   imgtool keygen -k ~/findmycat-keys/mcuboot-ecdsa-p256.pem -t ecdsa-p256
# then uncomment and point at it (keep the key out of git):
# SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="/Users/<you>/findmycat-keys/mcuboot-ecdsa-p256.pem"
