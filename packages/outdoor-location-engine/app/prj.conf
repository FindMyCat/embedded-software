# General config
CONFIG_FPU=y
CONFIG_NEWLIB_LIBC=y
CONFIG_POSIX_THREADS=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_NRF_MODEM_LIB=y
CONFIG_CJSON_LIB=y
CONFIG_SMS=y
CONFIG_SMS_SUBSCRIBERS_MAX_CNT=2
CONFIG_GPIO=y
CONFIG_DATE_TIME=y # Library that maintains the current date time UTC for A-GPS and P-GPS purposes

# nPM1300 fuel gauge
CONFIG_SENSOR=y
CONFIG_LED=y
CONFIG_NRF_FUEL_GAUGE=y

# MQTT-SN config
CONFIG_MQTT_SN_LIB=y
CONFIG_MQTT_SN_TRANSPORT_UDP=y
CONFIG_FINDMYCAT_CLOUD_HOSTNAME="your-findmycat-cloud-hostname"
CONFIG_MQTT_SN_GATEWAY_PORT=1885
CONFIG_MQTT_SN_LOCATION_TOPIC="/location"
CONFIG_MQTT_SN_STATUS_TOPIC="/status"

# nRF Cloud (for A-GNSS and cell location)
CONFIG_NRF_CLOUD=y
# TODO: migrate to CONFIG_NRF_CLOUD_COAP - NRF_CLOUD_REST is deprecated in NCS 3.2.x
CONFIG_NRF_CLOUD_REST=y
# CONFIG_NRF_CLOUD_AGNSS=y
CONFIG_NRF_CLOUD_AGNSS=n
CONFIG_LOCATION_SERVICE_NRF_CLOUD=y
CONFIG_MODEM_INFO=y # required by CONFIG_NRF_CLOUD_AGNSS
CONFIG_MODEM_INFO_ADD_NETWORK=y # required by CONFIG_NRF_CLOUD_AGNSS

CONFIG_NET_LOG=y
CONFIG_NRF_CLOUD_LOG_LEVEL_DBG=y
CONFIG_NRF_CLOUD_CLIENT_ID_SRC_IMEI=n
CONFIG_NRF_CLOUD_CLIENT_ID_PREFIX=""
CONFIG_NRF_CLOUD_CLIENT_ID_SRC_INTERNAL_UUID=y

# Heap and stacks
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_MAIN_STACK_SIZE=4096
# Extended memory heap size needed for encoding REST messages to JSON
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
# Increase AT monitor heap because %NCELLMEAS notifications can be large
CONFIG_AT_MONITOR_HEAP_SIZE=1024

# Location library
CONFIG_LOCATION=y
CONFIG_LOCATION_DATA_DETAILS=y

# Network
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=n

# LTE link control
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M_GPS=y
CONFIG_LTE_LC_EDRX_MODULE=y
CONFIG_LTE_LC_PSM_MODULE=y
# eDRX
CONFIG_LTE_EDRX_REQ=y
CONFIG_LTE_EDRX_REQ_VALUE_LTE_M="0101"
CONFIG_LTE_PTW_VALUE_LTE_M="0000"
# RAI
CONFIG_LTE_LC_RAI_MODULE=y
CONFIG_LTE_RAI_REQ=y
# Signal and CE level for the diagnostics and power hold
CONFIG_LTE_LC_CONN_EVAL_MODULE=y

# AT Host library - Used to send AT commands directy from an UART terminal and to allow
#		    integration with nRF Connect for Desktop LTE Link monitor application.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_AT_HOST_LIBRARY=n

# Uncomment the below and set above to "n" to test no - assisted gps.
# TODO: can we use external AGPS service that is free?
# CONFIG_LOCATION_SERVICE_EXTERNAL=y
# CONFIG_MULTICELL_LOCATION_SERVICE_NRF_CLOUD=n
# CONFIG_LOCATION_SERVICE_NRF_CLOUD=n

# Modem JWT
CONFIG_MODEM_JWT=y
CONFIG_MODEM_KEY_MGMT=y
CONFIG_HW_ID_LIBRARY=y

# Device power management (allows UART to be suspended between sends)
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Refresh rates
CONFIG_MQTT_SN_REFRESH_PERIOD_SECONDS=5
CONFIG_ACTIVE_MODE_LOCATION_REFRESH_PERIOD_SECONDS=1800
CONFIG_LOST_MODE_LOCATION_REFRESH_PERIOD_SECONDS=30

# LoRa
CONFIG_LORA_LINK=y
CONFIG_LORA_LINK_CAD_SYMBOLS=2
CONFIG_LORA_LINK_CAD_INTERVAL_MS=185
CONFIG_LORA_LINK_PEER_PREAMBLE=384
CONFIG_LORA_LINK_BURST_MS=1500
# Test: 10 s cycle for quick range tests; normal is 60 for both.
CONFIG_LORA_LINK_BURST_PERIOD_S=10
CONFIG_LORA_LINK_HEARTBEAT_S=10
CONFIG_LORA_LINK_CAD_PIN=9
CONFIG_LORA_LINK_ABSENCE_S=30
