# Logging
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# ZBus
CONFIG_ZBUS=y

# UART (for RAK3172 AT commands)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# Device power management
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

CONFIG_LED_STRIP=y
CONFIG_SPI_ESP32_INTERRUPT=y

CONFIG_ESP_SPIRAM=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y
CONFIG_ESP_SPIRAM_BSS_RELOC_LIBS_AND_OBJS="libmodules__mbedtls.a"

# Error handling
CONFIG_REBOOT=y

# CAD receive bench test
CONFIG_LORA_TX_POWER_DBM=14

CONFIG_LORA_PING_INTERVAL_S=10
CONFIG_LORA_BEACON_INTERVAL_S=1
CONFIG_LORA_PING_PREAMBLE=192

CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="FindMyCatHomeStation"
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_ESP32_SW_COEXIST_ENABLE=y
CONFIG_BLE_SCANNER=y
CONFIG_BLE_BEACON=y

# WiFi station
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_WIFI_STA_AUTO_DHCPV4=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_MAX_CONTEXTS=3
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_TC_RX_COUNT=0
CONFIG_NET_TC_TX_COUNT=0
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=16

# Geolocation lookup
CONFIG_HTTP_CLIENT=y
CONFIG_JSON_LIBRARY=y
CONFIG_HEAP_MEM_POOL_SIZE=45056

CONFIG_NET_LOG=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=52000
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048

CONFIG_MBEDTLS_BUILTIN=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ALG_SHA_512=y
CONFIG_MBEDTLS_PEM_PARSE_C=y

# The AES round tables are otherwise computed into RAM at init, eight 1 KB
# arrays of it. In flash they cost a handful of extra shifts per block, which
# nothing here is fast enough to notice.
CONFIG_MBEDTLS_AES_ROM_TABLES=y

CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MQTT_PUBLISHER=y
CONFIG_MQTT_PUBLISHER_TLS=y
CONFIG_MQTT_PUBLISHER_BROKER_PORT=8883
CONFIG_MQTT_PUBLISHER_HOME_LATITUDE="0.0"
CONFIG_MQTT_PUBLISHER_HOME_LONGITUDE="0.0"

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_STACK_SENTINEL=y

CONFIG_LOG_MODE_IMMEDIATE=y
