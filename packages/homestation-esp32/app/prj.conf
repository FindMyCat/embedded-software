# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_NET_LOG=y

# Fatal errors reboot (CONFIG_ERROR_REBOOT_ON_FATAL)
CONFIG_REBOOT=y

# Stacks and heap
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_STACK_SENTINEL=y
CONFIG_HEAP_MEM_POOL_SIZE=45056

# PSRAM config
CONFIG_ESP_SPIRAM=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y
CONFIG_ESP_SPIRAM_BSS_RELOC_LIBS_AND_OBJS="libmodules__mbedtls.a"

# Device power management
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# LED ring on SPI2
CONFIG_LED_STRIP=y
CONFIG_SPI_ESP32_INTERRUPT=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
# Connectable so the adverts can be done at 20 ms intervals
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="FindMyCatHomeStation"
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_BLE_SCANNER=y
CONFIG_BLE_BEACON=y
CONFIG_BT_SMP=y
CONFIG_BT_LONG_WQ_STACK_SIZE=3072
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n
CONFIG_BT_BONDABLE=n

# Flash settings
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# WiFi
CONFIG_WIFI=y
CONFIG_ESP32_WIFI_STA_RECONNECT=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_MAX_CONTEXTS=3
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_TC_RX_COUNT=0
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=16

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=90000
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ALG_SHA_512=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y

# MQTT
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MQTT_PUBLISHER=y
CONFIG_MQTT_PUBLISHER_TLS=y
