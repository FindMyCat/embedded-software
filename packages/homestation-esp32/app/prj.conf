# Logging
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# ZBus
CONFIG_ZBUS=y

# UART (for RAK3172 AT commands)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# Device power management
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Error handling
CONFIG_REBOOT=y

# CAD receive bench test
CONFIG_LORA_CAD_TEST=n
CONFIG_LORA_TX_POWER_DBM=14

CONFIG_LORA_PING=y
CONFIG_LORA_PING_INTERVAL_S=10
CONFIG_LORA_BEACON=y
CONFIG_LORA_BEACON_INTERVAL_S=2
CONFIG_LORA_PING_PREAMBLE=512

CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="FindMyCatHomeStation"
CONFIG_ESP32_SW_COEXIST_ENABLE=y
CONFIG_BLE_SCANNER=y
CONFIG_BLE_BEACON=y

# WiFi station
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_WIFI_STA_AUTO_DHCPV4=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_MAX_CONTEXTS=3
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=5
# Receive in the caller's context instead of handing off to a traffic class
# thread, which is a 2 KB stack for one priority level nothing here uses.
CONFIG_NET_TC_RX_COUNT=0
CONFIG_NET_TC_TX_COUNT=0
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_PKT_RX_COUNT=6
CONFIG_NET_PKT_TX_COUNT=3
CONFIG_NET_BUF_RX_COUNT=10
CONFIG_NET_BUF_TX_COUNT=6

# TEMPORARY: the geolocation lookup is off so BLE fits in DRAM.
#
# The Espressif Bluetooth controller reserves 56,156 bytes of internal SRAM
# (CONFIG_ESP32_BT_RESERVE_DRAM, fixed by the blob), leaving 140,452 for
# everything else. The mbedTLS heap and the kernel mempool alone were 122,656
# of that. Nothing below is needed once the server does the lookup instead, so
# this is the shape to keep; restore the block from git if you want the
# on-device HTTPS call back for a build.
#
# CONFIG_MBEDTLS_BUILTIN=y
# CONFIG_MBEDTLS_USER_CONFIG_ENABLE=y
# CONFIG_MBEDTLS_USER_CONFIG_FILE="mbedtls_user_config.h"
# CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
# CONFIG_TLS_CREDENTIALS=y
# CONFIG_MBEDTLS_ECP_C=y
# CONFIG_MBEDTLS_ECDH_C=y
# CONFIG_MBEDTLS_ECDSA_C=y
# CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
# CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
# CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
# CONFIG_MBEDTLS_ECP_DP_SECP384R1_ENABLED=y
# CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y
# CONFIG_MBEDTLS_HASH_ALL_ENABLED=y
# CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=y
# CONFIG_HTTP_CLIENT=y
# CONFIG_JSON_LIBRARY=y
# CONFIG_WIFI_GEOLOCATION=y
CONFIG_NET_LOG=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=10240
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=1024
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=1024

CONFIG_MBEDTLS_BUILTIN=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
# ECDSA rather than RSA: an RSA chain is more to verify and more to hold. This
# has to match what the broker actually presents, so check the certificate's
# key type before trusting the handshake to work.
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_PEM_PARSE_C=y

# The AES round tables are otherwise computed into RAM at init, eight 1 KB
# arrays of it. In flash they cost a handful of extra shifts per block, which
# nothing here is fast enough to notice.
CONFIG_MBEDTLS_AES_ROM_TABLES=y

CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MQTT_PUBLISHER=y
CONFIG_MQTT_PUBLISHER_TLS=y
CONFIG_MQTT_PUBLISHER_BROKER_PORT=8883
CONFIG_MQTT_PUBLISHER_HOME_LATITUDE="0.0"
CONFIG_MQTT_PUBLISHER_HOME_LONGITUDE="0.0"

CONFIG_MAIN_STACK_SIZE=4096

CONFIG_LOG_MODE_IMMEDIATE=y
